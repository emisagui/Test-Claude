<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de tareas</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f3f4f6; display: flex; justify-content: center; padding: 2rem 1rem; margin: 0; }
  main { background: #fff; width: 100%; max-width: 420px; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
  h1 { margin-top: 0; }
  form { display: flex; gap: .5rem; }
  input[type=text] { flex: 1; padding: .5rem; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: .5rem .8rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: .5rem; padding: .5rem 0; border-bottom: 1px solid #eee; }
  li span { flex: 1; }
  li.done span { text-decoration: line-through; color: #888; }
  li button { background: #ef4444; padding: .2rem .5rem; }
</style>
</head>
<body>
<main>
  <h1>📝 Mis tareas</h1>
  <form id="form">
    <input type="text" id="input" placeholder="Nueva tarea..." required>
    <button>Agregar</button>
  </form>
  <ul id="list"></ul>
</main>
<script>
  let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
  const list = document.getElementById("list");

  function save() { localStorage.setItem("tasks", JSON.stringify(tasks)); render(); }

  function render() {
    list.innerHTML = "";
    tasks.forEach((t, i) => {
      const li = document.createElement("li");
      if (t.done) li.className = "done";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = t.done;
      cb.onchange = () => { t.done = cb.checked; save(); };
      const span = document.createElement("span");
      span.textContent = t.text;
      const del = document.createElement("button");
      del.textContent = "✕";
      del.onclick = () => { tasks.splice(i, 1); save(); };
      li.append(cb, span, del);
      list.append(li);
    });
  }

  document.getElementById("form").onsubmit = e => {
    e.preventDefault();
    const input = document.getElementById("input");
    tasks.push({ text: input.value.trim(), done: false });
    input.value = "";
    save();
  };

  render();
</script>
</body>
</html>
